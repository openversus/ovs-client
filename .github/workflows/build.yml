# Builds the .NET client: tests, the formatting check, and the NativeAOT plugin,
# cross-compiled on Linux with lld-link and an xwin Windows SDK sysroot.
#
# The artifact is the install exactly as it ships: plugins/ holding OpenVersus_<version>.asi,
# OpenVersus.toml (from dotnet/sample.toml), LICENSE.txt and VERSION.txt, beside the ASI loader as
# xinput1_3.dll and its license. release.yml publishes the artifact of the build that already
# ran for a tagged commit rather than building it again, so every commit that may be tagged
# must get a build of its own: there is no path filter here, and no cancel-in-progress (a
# build canceled by the next push would leave its commit with nothing to release).
name: build

on:
  push:
    # Branches only. A tag push goes to release.yml, which uses this workflow's artifact.
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ------------------------------------------------------------------ tests
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build and test
        run: dotnet/build.sh test

      - name: Check formatting
        run: dotnet format dotnet/OpenVersus.slnx --verify-no-changes

  # ----------------------------------------------------------- windows x64
  windows-x64:
    needs: test
    runs-on: ubuntu-latest
    env:
      XWIN_VERSION: "0.10.0"
      XWIN_SHA256: d870eb4b2f390878af6da1ccd3cf321d22fcb72720984853b4be732ae597fc88
      # Accepts the Visual Studio Build Tools license for the Windows SDK that xwin downloads,
      # on the repository owner's behalf. build.sh asks otherwise, and a runner has no one to ask.
      ACCEPT_VS_BUILD_TOOLS_LICENSE: "true"
      # The x64 SDK libraries only; the cross-compile package fetches aarch64 as well by
      # default. An environment variable reaches MSBuild as a property of the same name.
      XwinArches: x86_64
      # The ASI loader's xinput1_3 build exists only under upstream's moving x64-latest
      # release, so it is pinned by digest: when upstream replaces it, this build fails
      # instead of shipping a loader nobody has looked at. To take the new one, check it and
      # update the digest (and the license's tag, below, to the release it came from).
      LOADER_URL: https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases/download/x64-latest/xinput1_3-x64.zip
      LOADER_SHA256: f1f5bc1e37b4872c92335a9487053764f0ef3800aed948cf8cdc16775a338b47
      LOADER_LICENSE_URL: https://raw.githubusercontent.com/ThirteenAG/Ultimate-ASI-Loader/v9.7.4/license
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set short SHA
        id: short_sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install lld
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lld

      - name: Install xwin
        run: |
          set -euo pipefail
          name="xwin-$XWIN_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/$name.tar.gz" "https://github.com/Jake-Shadle/xwin/releases/download/$XWIN_VERSION/$name.tar.gz"
          # Checked before anything in it runs.
          echo "$XWIN_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/bin"
          install -m 755 "$RUNNER_TEMP/$name/xwin" "$HOME/.local/bin/xwin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Preflight
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          # The publish needs both, and build.sh would say so too, but only after restoring;
          # this names what is missing, with what the lld package actually installed.
          command -v lld-link >/dev/null || { ls -l /usr/bin/*lld* /usr/lib/llvm-*/bin/lld-link 2>/dev/null || true; fail "lld-link is not on PATH after installing lld"; }
          command -v xwin >/dev/null || fail "xwin is not on PATH"
          echo "### Toolchain" >> "$GITHUB_STEP_SUMMARY"
          { dotnet --version; lld-link --version | head -1; xwin --version; } \
            | sed 's/^/    /' | tee -a "$GITHUB_STEP_SUMMARY"

      # The cross-compile package runs xwin only when the splat is missing, and the splat is
      # all it reads, so the splat is all that is cached. The key names everything that
      # decides its contents: the xwin version, the SDK version the package asks for, and
      # the architectures.
      - name: Windows SDK sysroot
        uses: actions/cache@v6
        with:
          path: ~/.cache/xwin/splat
          key: xwin-${{ env.XWIN_VERSION }}-sdk-10.0.22621-${{ env.XwinArches }}

      - name: Publish
        run: dotnet/build.sh publish

      - name: Stage
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          asi="dotnet/OpenVersus/bin/Release/net10.0/win-x64/publish/OpenVersus_$version.asi"
          rm -rf dist && mkdir -p dist/plugins
          cp "$asi" dist/plugins/
          cp dotnet/sample.toml dist/plugins/OpenVersus.toml
          cp LICENSE dist/plugins/LICENSE.txt
          cp VERSION dist/plugins/VERSION.txt
          curl -fsSL -o "$RUNNER_TEMP/loader.zip" "$LOADER_URL"
          echo "$LOADER_SHA256  $RUNNER_TEMP/loader.zip" | sha256sum -c - \
            || { echo "::error::the ASI loader at $LOADER_URL has changed; check the new one and update LOADER_SHA256 in build.yml"; exit 1; }
          unzip -q -j "$RUNNER_TEMP/loader.zip" xinput1_3.dll -d dist
          curl -fsSL -o dist/LICENSE_Ultimate_ASI_Loader.txt "$LOADER_LICENSE_URL"

      - name: Guard - the artifact is what ships
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          expected=$(printf '%s\n' LICENSE_Ultimate_ASI_Loader.txt plugins/LICENSE.txt plugins/OpenVersus.toml "plugins/OpenVersus_$version.asi" plugins/VERSION.txt xinput1_3.dll | sort)
          actual=$(cd dist && find . -type f | sed 's|^\./||' | sort)
          [ "$actual" = "$expected" ] || { echo "::error::dist does not hold exactly the release files"; diff <(echo "$expected") <(echo "$actual") || true; exit 1; }
          for pe in "dist/plugins/OpenVersus_$version.asi" dist/xinput1_3.dll; do
            [ "$(head -c 2 "$pe")" = "MZ" ] || { echo "::error::$pe is not a PE file"; exit 1; }
          done
          ( cd dist && find . -type f -exec ls -l {} + ) | tee -a "$GITHUB_STEP_SUMMARY"

      # Loose files: upload-artifact zips them, and nothing here needs an execute bit.
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: OpenVersus-${{ steps.short_sha.outputs.SHORT_SHA }}-windows-x64
          path: dist/
          if-no-files-found: error
