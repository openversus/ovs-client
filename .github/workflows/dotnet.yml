name: .NET client tests

on:
  push:
    paths:
      - "dotnet/**"
      - "VERSION"
      - "sample.ini"
      - ".github/workflows/dotnet.yml"
  pull_request:
    paths:
      - "dotnet/**"
      - "VERSION"
      - "sample.ini"
      - ".github/workflows/dotnet.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build and test
        run: dotnet/build.sh test

      - name: Check formatting
        run: dotnet format dotnet/OpenVersus.slnx --verify-no-changes
