# Publishes a release when a version tag is pushed.
#
# Nothing is built here. The release is made from the artifact of the build that already ran
# for the tagged commit (build.yml): the exact files that were built and tested, not a rebuild
# of them.
#
# Tags are bare versions, the contents of VERSION (2026.09.25.01, not v2026.09.25.01). A
# suffix such as 2026.09.25.01-test1 publishes as a prerelease.
#
# To release: bump VERSION, push, let the build finish (or don't -- this waits for it), then
# tag that commit and push the tag.
#
# Assets: OpenVersus_v<tag>.zip, the install (extracted beside the game's executable, the
# rollback node for every platform inside); OpenVersus_<version>.zip, the package (build.sh
# package: plugins/OpenVersus/ with the plugin, its settings file and every node; what MVS Buddy
# installs); OpenVersus_<version>.asi, the plugin alone, which is what the server's download_url
# points the auto-updater at; OVS_Node_<version>_<platform> archives, the node alone per
# platform, which the updater installs beside the game, and OVS_Node_<version>_all.zip, every
# platform in one for hand installs, with SHA256SUMS-node; the OVS_* paks of the previous release
# (GitHub's "latest": the newest that is not a prerelease), carried over so the server and the
# updater see the same content under the new release; a .sha256 beside each built file, and
# SHA256SUMS. The release is made as a draft and published once every asset is on it, so the
# server's "latest" never shows a half-filled release.
name: release

on:
  push:
    # Deliberately loose. The exact format is enforced by the version check below, where a
    # bad tag fails loudly; a pattern that failed to match would instead mean the release
    # silently never ran.
    tags: [ '[0-9]*' ]

permissions:
  contents: write   # create the release
  actions: read     # find the build run and download its artifact

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tag must match VERSION
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          base="${tag%%-*}"
          src=$(tr -d '[:space:]' < VERSION)
          echo "tag $tag   base $base   VERSION $src"
          # The plugin is named for VERSION and reports it to the server, and the updater
          # compares versions, so a release whose tag disagrees with the binary is worse than
          # no release.
          [ -n "$src" ] || { echo "::error::VERSION is empty"; exit 1; }
          [ "$base" = "$src" ] || { echo "::error::tag $tag does not match VERSION \"$src\" -- bump VERSION and tag that commit"; exit 1; }
          {
            echo "label=$tag"
            echo "base=$base"
            echo "prerelease=$([ "$tag" != "$base" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Find the build for this commit
        id: build
        run: |
          set -euo pipefail
          # The build is triggered by the branch push, not the tag. If both were pushed
          # together it may still be running, so wait for it; if the commit was pushed with
          # [skip ci], or never to a branch, no build exists and never will.
          deadline=$(( $(date +%s) + 45*60 ))
          grace=$(( $(date +%s) + 5*60 ))
          while :; do
            runs=$(gh run list --repo "$REPO" --workflow build.yml --commit "$GITHUB_SHA" \
                     --json databaseId,status,conclusion --limit 20)
            ok=$(jq -r '[.[] | select(.conclusion == "success")] | sort_by(.databaseId) | last | .databaseId // empty' <<<"$runs")
            if [ -n "$ok" ]; then echo "run=$ok" >> "$GITHUB_OUTPUT"; echo "using build run $ok"; break; fi
            total=$(jq 'length' <<<"$runs")
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            now=$(date +%s)
            if [ "$total" -eq 0 ] && [ "$now" -ge "$grace" ]; then
              echo "::error::no build exists for $GITHUB_SHA -- was it pushed with [skip ci], or never pushed to a branch?"; exit 1
            fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "::error::every build for $GITHUB_SHA finished without succeeding (a failed or canceled build); rerun it, then rerun this"; exit 1
            fi
            [ "$now" -lt "$deadline" ] || { echo "::error::timed out waiting for the build of $GITHUB_SHA"; exit 1; }
            echo "waiting for the build of $GITHUB_SHA ($total found, $pending still running)"
            sleep 30
          done

      - name: The artifact must be present
        id: artifact
        run: |
          set -euo pipefail
          names=$(gh api "repos/$REPO/actions/runs/${{ steps.build.outputs.run }}/artifacts" \
                    --jq '.artifacts[] | select(.expired == false) | .name')
          echo "$names"
          name=$(grep -- '-windows-x64$' <<<"$names" || true)
          [ -n "$name" ] || { echo "::error::build run ${{ steps.build.outputs.run }} has no unexpired windows-x64 artifact"; exit 1; }
          [ "$(wc -l <<<"$name")" -eq 1 ] || { echo "::error::build run ${{ steps.build.outputs.run }} has more than one windows-x64 artifact"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          node=$(grep -- '-node$' <<<"$names" || true)
          [ -n "$node" ] || { echo "::error::build run ${{ steps.build.outputs.run }} has no unexpired node artifact"; exit 1; }
          [ "$(wc -l <<<"$node")" -eq 1 ] || { echo "::error::build run ${{ steps.build.outputs.run }} has more than one node artifact"; exit 1; }
          echo "node=$node" >> "$GITHUB_OUTPUT"
          package=$(grep -- '-package$' <<<"$names" || true)
          [ -n "$package" ] || { echo "::error::build run ${{ steps.build.outputs.run }} has no unexpired package artifact"; exit 1; }
          [ "$(wc -l <<<"$package")" -eq 1 ] || { echo "::error::build run ${{ steps.build.outputs.run }} has more than one package artifact"; exit 1; }
          echo "package=$package" >> "$GITHUB_OUTPUT"

      # By name, into a directory of our own: download-artifact extracts a named artifact straight
      # into path. Downloading "all" does not reliably add a directory per artifact (v8 said it
      # would and then extracted into path anyway, which broke the 2026.09.25.07 release).
      - name: Download the artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.artifact.outputs.name }}
          run-id: ${{ steps.build.outputs.run }}
          github-token: ${{ github.token }}
          path: artifacts/install

      - name: Download the node archives
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.artifact.outputs.node }}
          run-id: ${{ steps.build.outputs.run }}
          github-token: ${{ github.token }}
          path: artifacts/node

      - name: Download the package zip
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.artifact.outputs.package }}
          run-id: ${{ steps.build.outputs.run }}
          github-token: ${{ github.token }}
          path: artifacts/package

      # The paks of the previous release, each checked against the SHA-256 GitHub records for it. The release being
      # made is a draft until the end, so "latest" is still the previous one here.
      - name: Carry the paks over
        id: paks
        run: |
          set -euo pipefail
          mkdir -p paks
          previous=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          if [ -z "$previous" ]; then
            echo "no previous release: no paks to carry over" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "count=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          [ "$previous" != "${{ steps.version.outputs.label }}" ] || { echo "::error::$previous is already the latest release; was this tag released before?"; exit 1; }
          gh api "repos/$REPO/releases/latest" --jq '.assets[] | select(.name | test("^OVS_[A-Za-z0-9._-]+\\.(pak|utoc|ucas|sig)$"; "i")) | "\(.name) \(.digest // "") \(.browser_download_url)"' > paks.list
          count=$(wc -l < paks.list | tr -d ' ')
          echo "previous release $previous: $count pak file(s)" | tee -a "$GITHUB_STEP_SUMMARY"
          while read -r name digest url; do
            [ -n "$name" ] || continue
            curl -fsSL --retry 3 -o "paks/$name" "$url"
            expected="${digest#sha256:}"
            [ -n "$expected" ] || { echo "::error::GitHub records no digest for $name"; exit 1; }
            echo "$expected  paks/$name" | sha256sum -c - >/dev/null || { echo "::error::$name does not match the digest GitHub records for it"; exit 1; }
            echo "  $name" | tee -a "$GITHUB_STEP_SUMMARY"
          done < paks.list
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          set -euo pipefail
          label="${{ steps.version.outputs.label }}"
          base="${{ steps.version.outputs.base }}"
          dir=artifacts/install
          [ -d "$dir/plugins" ] || { echo "::error::the downloaded artifact has no plugins directory"; ls -R artifacts; exit 1; }
          # Ties the tag to the binary: the build names the plugin for the VERSION it read.
          asi="$dir/plugins/OpenVersus/OpenVersus_$base.asi"
          [ -f "$asi" ] || { echo "::error::the artifact has no plugins/OpenVersus/OpenVersus_$base.asi"; ls -R "$dir"; exit 1; }
          ( cd "$dir" && zip -qr "$GITHUB_WORKSPACE/OpenVersus_v$label.zip" . )
          cp "$asi" .
          # The package zip, named for VERSION (no v): what MVS Buddy installs.
          [ -f "artifacts/package/OpenVersus_$base.zip" ] || { echo "::error::the package artifact has no OpenVersus_$base.zip"; ls -R artifacts/package; exit 1; }
          cp "artifacts/package/OpenVersus_$base.zip" .
          # The node archives, named for this version (the server offers only a release's own): one per platform.
          for rid in win-x64 linux-x64 osx-x64 osx-arm64; do
            ls artifacts/node/OVS_Node_"$base"_"$rid".* >/dev/null 2>&1 || { echo "::error::the node artifact has no OVS_Node_${base}_$rid archive"; ls -R artifacts/node; exit 1; }
          done
          cp artifacts/node/OVS_Node_"$base"_* .
          # The node archives' own checksum list, as the node build wrote it (SHA256SUMS below covers them too).
          cp artifacts/node/SHA256SUMS-node .
          # Checksums in binary mode ("hash *file"), the explicit form a Windows sha256sum also
          # expects. One .sha256 per file so each download has its checksum beside it, plus
          # the combined SHA256SUMS. Verify with: sha256sum -c <file>.sha256
          for f in OpenVersus_*.zip OpenVersus_*.asi OVS_Node_*; do
            sha256sum -b "$f" > "$f.sha256"
          done
          sha256sum -b OpenVersus_*.zip OpenVersus_*.asi OVS_Node_*.zip OVS_Node_*.tar.gz > SHA256SUMS
          if [ "${{ steps.paks.outputs.count }}" != "0" ]; then ( cd paks && sha256sum -b -- * ) >> SHA256SUMS; fi
          cat SHA256SUMS
          sha256sum -c ./*.sha256   # prove each file verifies before it is published
          unzip -l "OpenVersus_v$label.zip"

      - name: Notes
        run: |
          set -euo pipefail
          {
            echo "Built from \`${GITHUB_SHA}\` in [build run ${{ steps.build.outputs.run }}](https://github.com/$REPO/actions/runs/${{ steps.build.outputs.run }})."
            echo
            echo "- \`OpenVersus_v${{ steps.version.outputs.label }}.zip\`: the install. Extract it beside the game's executable, \`MultiVersus-Win64-Shipping.exe\`."
            echo "- \`OpenVersus_${{ steps.version.outputs.base }}.zip\`: the package (\`plugins/OpenVersus/\` with the plugin, its settings file and every node), which MVS Buddy installs."
            echo "- \`OpenVersus_${{ steps.version.outputs.base }}.asi\`: the plugin alone, for updating an existing install (replace the old \`OpenVersus*.asi\` in \`plugins\`; the ASI loader loads every \`.asi\` there)."
            echo "- \`OVS_Node_${{ steps.version.outputs.base }}_<platform>.zip\` / \`.tar.gz\`: the rollback node alone, per platform (the install zip already holds all four; the mod keeps the one it needs current from these)."
            if [ "${{ steps.paks.outputs.count }}" != "0" ]; then echo "- \`OVS_*.pak\`, \`.utoc\`, \`.ucas\`, \`.sig\`: the game content, carried over from the previous release."; fi
            echo "- \`*.sha256\`, \`SHA256SUMS\`: checksums. Verify with \`sha256sum -c <file>.sha256\`."
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      # A draft until every asset is on it (the built files here, the paks next), then published: the server's "latest"
      # and MVS Buddy read a release's assets, and must never see this one half-filled.
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: OpenVersus ${{ steps.version.outputs.label }}
          body_path: notes.md
          draft: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            OpenVersus_*.zip
            OpenVersus_*.asi
            OpenVersus_*.sha256
            OVS_Node_*
            SHA256SUMS
            SHA256SUMS-node

      - name: Attach the paks and publish
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.label }}"
          if [ "${{ steps.paks.outputs.count }}" != "0" ]; then
            gh release upload --repo "$REPO" "$tag" paks/* --clobber
          fi
          gh release edit --repo "$REPO" "$tag" --draft=false
          gh release view --repo "$REPO" "$tag" --json assets --jq '.assets[] | "\(.name) \(.size)"' | tee -a "$GITHUB_STEP_SUMMARY"
